intro: |
  我是一名从事量子信息与量子理论基础研究的数学物理研究者。我的研究方向包括量子网络关联、多体物理与量子密码学，主要使用算子代数与非交换多项式优化等方法。

  自 2023 年 10 月起，我在 Inria 萨克雷中心的 PhIQuS 小组攻读博士学位，导师为 [Marc-Olivier Renou](https://marcolivierrenou.com/)。此前，我分别于 ETH Zürich 与 University of Toronto 获得数学硕士及数学与物理学学士学位。

  欢迎通过 *xu[dot]xiangling[at]inria[dot]fr* 与我联系，也可查看导航栏中的[个人简历](/uploads/CV_phdphase.pdf)。
